<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movers Test 27 | ZEYN</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168,85,247,.16), transparent 35%),
        #f6f8fc;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .page {
      width: min(100%, 620px);
    }

    .brand {
      text-align: center;
      margin-bottom: 16px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 18px 50px rgba(20, 33, 61, .14);
    }

    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #3157c8;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.1;
    }

    .subtitle {
      color: #667085;
      margin: 10px 0 26px;
      font-size: 16px;
    }

    .player-wrap {
      padding: 18px;
      background: #f7f9fd;
      border-radius: 18px;
      border: 1px solid #e9edf5;
    }

    audio {
      width: 100%;
      display: block;
    }

    .direct-link {
      display: inline-block;
      margin-top: 14px;
      color: #3157c8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .nav-button {
      text-decoration: none;
      text-align: center;
      padding: 13px 12px;
      border-radius: 14px;
      font-weight: 700;
      border: 1px solid #dce3ef;
      color: #26324a;
      background: #fff;
    }

    .nav-button.primary {
      background: #263f9f;
      border-color: #263f9f;
      color: white;
    }

    .nav-button.disabled {
      opacity: .4;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      margin-top: 16px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .navigation {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <div class="brand-name">ZEYN</div>
      <div class="brand-subtitle">English Listening Practice</div>
    </div>

    <main class="card">
      <span class="badge">CAMBRIDGE MOVERS</span>
      <h1>Movers Test 27</h1>
      <p class="subtitle">Listen carefully and complete the test in your book.</p>

      <section class="player-wrap">
        <audio controls preload="metadata" src="https://zeyn-tedris-merkezi.github.io/audio/Movers%20Test%2027.mp3">
          Your browser does not support audio playback.
        </audio>
        <a class="direct-link" href="https://zeyn-tedris-merkezi.github.io/audio/Movers%20Test%2027.mp3">Open audio directly</a>
      </section>

      <nav class="navigation">
        <a class="nav-button " href="test26.html">← Previous Test</a>
        <a class="nav-button primary disabled" href="#">Next Test →</a>
      </nav>
    </main>

    <div class="footer">ZEYN Tədris Mərkəzi</div>
  </div>
</body>
</html>
