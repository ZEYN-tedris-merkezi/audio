<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movers Test 16 | ZEYN Listening Portal</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #e5eaf2;
      --primary: #263f9f;
      --primary-2: #5a67d8;
      --soft: #eef3ff;
      --shadow: 0 18px 50px rgba(20, 33, 61, .14);
    }

    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --line: #374151;
      --primary: #7c8cff;
      --primary-2: #9aa6ff;
      --soft: #27324b;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(90,103,216,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(38,63,159,.15), transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: .25s ease;
    }

    .page {
      width: min(100%, 680px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .theme-toggle {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.08;
    }

    .subtitle {
      color: var(--muted);
      margin: 10px 0 26px;
      font-size: 16px;
    }

    .player-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }

    audio {
      width: 100%;
      display: block;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .tool-btn, select {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 10px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
    }

    .progress {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .direct-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .nav-button {
      text-decoration: none;
      text-align: center;
      padding: 14px 12px;
      border-radius: 14px;
      font-weight: 800;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--card);
    }

    .nav-button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .nav-button.disabled {
      opacity: .4;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 15px;
    }

    @media (max-width: 560px) {
      .card {
        padding: 24px 16px;
      }

      .tools {
        grid-template-columns: 1fr 1fr;
      }

      .navigation {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-name">ZEYN</div>
        <div class="brand-subtitle">Listening Portal</div>
      </div>
      <button class="theme-toggle" id="themeBtn" type="button">🌙 Dark mode</button>
    </div>

    <main class="card">
      <div class="meta">
        <span class="badge">CAMBRIDGE MOVERS</span>
        <span class="badge">TEST 16 OF 27</span>
      </div>

      <h1>Movers Test 16</h1>
      <p class="subtitle">Listen carefully and complete the tasks in your book.</p>

      <section class="player-box">
        <audio id="audio" controls preload="metadata" src="https://zeyn-tedris-merkezi.github.io/audio/Movers%20Test%2016.mp3">
          Your browser does not support audio playback.
        </audio>

        <div class="tools">
          <button class="tool-btn" id="backBtn" type="button">↶ 10 sec</button>
          <button class="tool-btn" id="forwardBtn" type="button">10 sec ↷</button>
          <select id="speed" aria-label="Playback speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1× speed</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
          <button class="tool-btn" id="restartBtn" type="button">Restart</button>
        </div>

        <div class="progress" id="progressText">Ready to play</div>
        <a class="direct-link" href="https://zeyn-tedris-merkezi.github.io/audio/Movers%20Test%2016.mp3">Open audio directly</a>
      </section>

      <nav class="navigation">
        <a class="nav-button " href="test15.html">← Previous Test</a>
        <a class="nav-button primary " href="test17.html">Next Test →</a>
      </nav>
    </main>

    <div class="footer">ZEYN Tədris Mərkəzi</div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const progressText = document.getElementById('progressText');
    const speed = document.getElementById('speed');
    const themeBtn = document.getElementById('themeBtn');

    document.getElementById('backBtn').addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    document.getElementById('forwardBtn').addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 10);
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      audio.currentTime = 0;
      audio.play();
    });

    speed.addEventListener('change', () => {
      audio.playbackRate = Number(speed.value);
    });

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    audio.addEventListener('timeupdate', () => {
      progressText.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    audio.addEventListener('ended', () => {
      progressText.textContent = 'Audio completed';
    });

    const savedTheme = localStorage.getItem('zeyn-theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️ Light mode';
    }

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeBtn.textContent = isDark ? '☀️ Light mode' : '🌙 Dark mode';
      localStorage.setItem('zeyn-theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
